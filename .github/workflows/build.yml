name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/quota

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Quota"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.quota'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.quota"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <application
                  android:label="مصرف اینترنت"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/quota/MainActivity.kt << 'EOF'
          package com.example.quota

          import android.app.Activity
          import android.net.wifi.WifiManager
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale

          class MainActivity : Activity() {

              private lateinit var tv: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(48, 48, 48, 48)
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                  }
                  tv = TextView(this).apply {
                      textSize = 22f
                      gravity = Gravity.CENTER
                      text = "در حال دریافت..."
                  }
                  val btn = Button(this).apply {
                      text = "بروزرسانی"
                      setOnClickListener { load() }
                  }
                  layout.addView(tv)
                  layout.addView(btn)
                  setContentView(layout)
                  load()
              }

